name: peg_proprio_goal_wrench_desired

# Match the state inputs and desired-command target used by the corresponding
# RDP experiment. The stored wrench was already processed upstream by the
# causal 15 Hz Butterworth LPF pipeline.
dataset_path: /home/iris/Workspace/junsu/Data/replay_buffer/square_peg_in_hole_21mm_20260916_p2p_goal_desired_zarr

shape_meta: &shape_meta
  obs:
    # Vision-free ablation: TCP pose, relative goal, and force/torque.
    left_robot_tcp_pose:
      shape: [9]
      type: low_dim
    # Already expressed relative to the current TCP pose on disk.
    left_goal_pose_rel:
      shape: [9]
      type: low_dim
    left_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    shape: [9]

# Training-only no-op runner. Real-robot evaluation is wired separately.
env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.p2p_image_dataset.P2PImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  relative_action: true
  relative_tcp_obs_for_relative_action: true
  # Match RDP: repeat the current relative goal over both observation steps.
  single_step_obs_keys: [left_goal_pose_rel]
  load_to_memory: true
