name: valve_insertion_p2p_image_next_state

image_shape: [3, 240, 320]
# This cropped observation Zarr already stores action[t] = measured TCP[t+1].
# No desired-command sidecar is attached in this task variant.
dataset_path: /home/iris/Workspace/junsu/DP/data/datasets/valve_insertion_after_grasp_30f

shape_meta: &shape_meta
  obs:
    external_img:
      shape: ${task.image_shape}
      type: rgb
    left_wrist_img:
      shape: ${task.image_shape}
      type: rgb
    left_robot_tcp_pose:
      shape: [9]
      type: low_dim
    left_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    # Next measured TCP state; no gripper output and no goal-pose input.
    shape: [9]

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.p2p_image_dataset.P2PImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  relative_action: true
  relative_tcp_obs_for_relative_action: true
  load_to_memory: true
